# Synced from cargo-barbican v0.28.1
# Review and edit this local policy after copying or running `cargo barbican policy init`.

[release_age]
minimum_days = 7

[high_scrutiny]
new_direct_dependencies = true
non_crates_io_direct_dependencies = true
non_crates_io_source_changes = true
build_rs_changes = true
proc_macro_changes = true
native_sys_crates = true

[delegates]
# How to report native deny.toml/.cargo/audit.toml IDs without active governance.
# All native ignores are neutralised; governed compatibility IDs bypass this posture.
unmanaged_delegated_policy = "warn" # warn | deny | allow

[delegates.advisories]
# Structured advisory scanner used for lockfile advisory reconciliation.
lockfile_scanner = "cargo-deny" # cargo-deny | cargo-audit | both

[delegates.cargo_deny]
# cargo-deny check groups Barbican runs and reconciles. Unset, the default is
# advisories, bans, and sources, plus licenses whenever the checked-in
# deny.toml declares a [licenses] policy. Set an explicit list to override in
# either direction — an explicit list is authoritative.
# checks = ["advisories", "bans", "sources"] # advisories | bans | sources | licenses
