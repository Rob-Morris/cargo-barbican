# Active reviewed Rust dependency families.
#
# Leave this file absent or with no active families when no checked-pin gate is
# required.
#
# Each active family entry carries:
# - `name`: stable family label used in review records and tooling output
# - `review_record`: checked-in Markdown review record that activated the family
#   (must be a relative repo path with no `..` traversal)
# - optional `direct`: exact manifest requirements for direct crates, including
#   the leading `=`
# - `resolved`: exact Cargo.lock targets; for crates.io reviewed artefacts the
#   preferred form is `{ version = "...", checksum_sha256 = "..." }`
# - optional `allowed_surfaces`: reviewed execution surfaces for crates already
#   present in the same `resolved` map

[rust]

# [[rust.families]]
# name = "example-family-2026-05-27"
# review_record = "docs/dependency-reviews/2026-05-27-example-family.md"
#
# [rust.families.direct]
# some-crate = "=1.2.3"
#
# [rust.families.resolved]
# some-crate = { version = "1.2.3", checksum_sha256 = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" }
# companion-crate = "0.4.5"
#
# [rust.families.allowed_surfaces]
# some-crate = ["build-rs", "native-sys"]
