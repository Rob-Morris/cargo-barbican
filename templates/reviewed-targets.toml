# Synced from cargo-barbican v0.36.0
# Copy this template into a consumer repo, then edit that repo's
# reviewed-targets.toml to declare reviewed dependency families.

# Active reviewed Rust dependency families.
#
# Standalone pin check can skip when this file is absent or has no active
# families. Strict verify/Gatehouse gates require at least one active reviewed
# Rust family, including for a dependency-free graph; an empty scaffold is not
# completed adoption. Do not invent a dummy family to bypass that requirement.
#
# Each active family entry carries:
# - `name`: stable family label used in review records and tooling output
# - `review_record`: checked-in Markdown review record that activated the family
#   (must be a relative repo path with no `..` traversal)
# - optional `direct`: exact manifest requirements for direct crates, including
#   the leading `=`
# - `resolved`: exact Cargo.lock targets; for crates.io reviewed artefacts the
#   preferred form is `{ version = "...", checksum_sha256 = "..." }`. Every
#   matching Cargo.lock entry must be crates.io sourced regardless of form; the
#   version-only string form (`some-crate = "1.2.3"`) still enforces that
#   crates.io source requirement but does not bind the resolved artefact
#   checksum, so prefer the structured checksum form
# - optional `allowed_surfaces`: reviewed execution surfaces for crates already
#   present in the same `resolved` map
# - optional `allowed_age_exceptions`: reviewed release-age exceptions for
#   crates already present in the same `resolved` map with `checksum_sha256`
# - optional `allowed_advisories`: reviewed advisory exceptions for crates
#   already present in the same `resolved` map with `checksum_sha256`; `review_by`
#   is the re-review deadline, and audit fails the exception once past it

[rust]

# [[rust.families]]
# name = "example-family-2026-05-27"
# review_record = "docs/dependency-reviews/2026-05-27-example-family.md"
#
# [rust.families.direct]
# some-crate = "=1.2.3"
#
# [rust.families.resolved]
# some-crate = { version = "1.2.3", checksum_sha256 = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" }
# companion-crate = "0.4.5"
#
# [rust.families.allowed_surfaces]
# some-crate = ["build-rs", "native-sys"]
#
# [rust.families.allowed_age_exceptions]
# some-crate = "1.2.3"
#
# [rust.families.allowed_advisories]
# some-crate = [{ id = "RUSTSEC-2026-0001", review_by = "2026-12-31" }]

# Exact Git targets use a distinct identity; review each locked Git package.
# See docs/user/git-sources.md in the upstream repo for complete constraints.
# [rust.families.resolved]
# upstream = { source = "git", version = "0.1.0", url = "https://example.org/repo.git", rev = "0123456789abcdef0123456789abcdef01234567" }
# Git direct entries use source/url/rev, without version. Git advisory and age
# exceptions are unsupported. Scaffolding does not complete a source review.
