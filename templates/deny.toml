# Synced from cargo-barbican v0.26.0
# Runtime advisory checks are owned by cargo-barbican audit.
#
# Do not add [advisories] here to weaken advisory handling. During audit,
# cargo-barbican generates a runtime cargo-deny config that forces:
# - ignore = []
# - yanked = "deny"
# - unmaintained = "all"
# - unsound = "all"
#
# This checked-in file carries the non-advisory cargo-deny posture that
# cargo-barbican preserves for bans, sources, and licenses checks.
#
# Declaring a [licenses] policy here is an expressed intent to enforce it:
# unless barbican.toml sets an explicit delegates.cargo_deny.checks list,
# audit runs the cargo-deny licenses check whenever this file carries a
# [licenses] table, and skips it when there is none.
#
# [licenses]
# allow = ["MIT", "Apache-2.0"]

# Optional repo-specific graph scope. cargo-barbican preserves targets/features
# scope but strips graph exclusion keys that can hide advisories.
#
# [graph]
# targets = [
#   "aarch64-apple-darwin",
#   "x86_64-apple-darwin",
#   "x86_64-unknown-linux-gnu",
#   "x86_64-pc-windows-msvc",
# ]

[bans]
# Tighten to "deny" once duplicate versions are resolved for this repo.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
# Tighten to "deny" after adding explicit allow-git entries for this repo.
unknown-git = "warn"
allow-registry = [
  "https://github.com/rust-lang/crates.io-index",
]
