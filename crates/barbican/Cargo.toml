[package]
name = "barbican"
version = "0.16.0"
description = "Library for Rust supply-chain hardening: release-age gating, lockfile diffing, policy assessment."
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = { version = "=0.10.9", default-features = false, features = ["force-soft"] }
tar = { version = "=0.4.46", default-features = false }
thiserror = "=2.0.18"
time = { version = "=0.3.47", default-features = false, features = ["std", "parsing"] }
toml = "=1.1.2"
