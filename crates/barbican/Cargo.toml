[package]
name = "barbican"
version = "0.1.1"
description = "Library for Rust supply-chain hardening: release-age gating, lockfile diffing, policy assessment."
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["std", "parsing"] }
toml = "1.1"
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
