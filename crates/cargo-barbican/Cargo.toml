[package]
name = "cargo-barbican"
version = "0.2.0"
description = "Cargo subcommand for Rust supply-chain hardening. Invokable as `cargo barbican`."
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "cargo-barbican"
path = "src/main.rs"

[dependencies]
barbican = { path = "../barbican" }
clap = { version = "4", features = ["derive"] }
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
